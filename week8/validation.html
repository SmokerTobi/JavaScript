<!DOCTYPE html>
<head>
    <title>Gym Admmission Form</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background : #f2f2f2;
        }

        .container{
            width : 400px;
            margin : 40px auto;
            background : white;
            padding : 20px;
            border-radius : 10px;
            box-shadow : 0 0 10px gray;
        }

        h2{
            text-align: center;
            
        }

        label{
            display : block;
            margin-top: 15px;
        }

        input,select{
            width : 100%;
            padding: 8px;
            margin-top: 5px;
        }
        .error{
            color : red;
            font-size : 13px;
        }

        .success{
            color : green;
            font-size : 14px;
            text-align: center;
        }
        button{
            width : 100%;
            padding : 10px;
            margin-top : 15px;
            background: green;
            color : white;
            border : none;
            cursor : pointer;
        }
        
    </style>
</head>

<body>
    <div class="container">
        <h2>Gym Admmission Form</h2>

        <form id="gymForm">
            <label>Full Name</label>
            <input type="text" id = "name">
            <span id ="nameError" class="error"></span>

            <label>Email</label>
            <input type="email" id = "email">
            <span id ="emailError" class="error"></span>

            <label>Mobile Number</label>
            <input type="number" id = "mobile">
            <span id ="mobileError" class="error"></span>

            <label>Age</label>
            <input type="number" id = "age">
            <span id ="ageError" class="error"></span>

            <label>Membership Plan</label>
            <select id ="plan">
                <option value="">Select Plan</option>
                <option value="monthly">Monthly</option>
                <option value="quarterly">Quarterly</option>
                <option value="yearly">Yearly</option>
            </select>
            <span id ="planError" class="error"></span>

            <button type="submit">Submit</button>
            <p id ="result" class="success"></p>
        </form>
    </div>
    <script>
        //nMAE vALIDATION (INPUT EVENT)
        document.getElementByTd("name").addEventLister("input", function(){
            let name = this.value;
            if(/^[A-Za-z ]+$/.test(name)){
                document.getElementById("nameError").innerHTML = "";
            }else{
                document.getElementById("nameError").innerHTML = "Only letters and spaces allowed";
            }      
        });

        //Age Validation (blur event)
        document.getElementByTd("age").addEventLister("blur", function(){
            let age = this.value;
            if(age >= 16 && age <= 60){
                document.getElementById("ageError").innerHTML = "";
            }else{
                document.getElementById("ageError").innerHTML = "Age must be between 16 and 60";
            }      
        });

        //Email Validation (blur)
        document.getElementById("email").addEventLister("input",function(){
            let email = this.value;
            let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (pattern.test(email)) {
                document.getElementById("emailError").innerHTML = "";
            } else {
                document.getElementById("emailError").innerHTML = "Invalid Email Address";
            }
        });

        //mobile Validation
        document.getElementById("mobile").addEventLister("input",function(){
            let mobile = this.value;
            if(/^\d{10}$/.test(mobile)){
                document.getElementById("mobileError").innerHTML = "";
            }else{
                document.getElementById("mobileError").innerHTML = "Invalid Mobile Number";
            }    
        })

        //Membership Validation
        document.getElementById("plan").addEventLister("change", function(){
            let plan = this.value;
            if(plan != ""){
                document.getElementById("planError").innerHTML = "";
            }else{
                document.getElementById("planError").innerHTML = "Select a Membership Plan";
            }
        });

        //FORM SUBMISSION
        document.getElementById("gymForm").addEventLister("submit", function(e){
            e.preventDefault();
            
            if(
                document.getElementByTd("nameError").innerHTML == "" &&
                document.getElementByTd("emailError").innerHTML == "" &&
                document.getElementByTd("mobileError").innerHTML == "" &&
                document.getElementByTd("ageError").innerHTML == "" &&
                document.getElementByTd("planError").innerHTML == ""
            ){
                document.getElementById("result").innerHTML = "Gym Admission Successful!";
            }else{
                document.getElementById("result").innerHTML = "Please Fill All Fields Correctly.";
            }
        });
    </script>
</body>
</html>
